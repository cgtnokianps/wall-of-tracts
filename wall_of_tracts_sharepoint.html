        :root {
            --bg: #0f1115;
            --surface: #1a1d24;

            --border: #2e333d;
            --text: #e8eaed;
            --text-muted: #9aa0aa;
            --accent: #e63946;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: var(--text);
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: var(--text-muted);
        }

        .year-section {
            margin-bottom: 50px;
        }

        .year-separator {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }

        .year-separator::before,
        .year-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .year-separator-label {
            font-size: 1.35em;
            font-weight: 600;
            letter-spacing: 0.18em;
            color: var(--text);
            padding: 6px 22px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            white-space: nowrap;
        }

        .year-title {
            color: var(--text);
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        .card-preview {
            width: 100%;
            height: 350px;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .card-preview canvas,
        .card-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-preview-placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9em;
            width: 100%;
            padding: 20px;
        }

        .card-preview-placeholder.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-content {
            padding: 18px 20px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .card-title {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .card-meta {
            font-size: 0.72em;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .card-summary {
            font-size: 0.82em;
            line-height: 1.55;
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-disabled {
            background: var(--surface-2);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-disabled:hover {
            transform: none;
        }

        .btn-label {
            display: inline-block;
            font-size: 0.75em;
            background: var(--surface-2);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .card-preview {
                height: 250px;
            }
        }
    </style>

        function showPlaceholder(container, tract) {
            container.innerHTML = `<div class="card-preview-placeholder"><p>📄 ${tract.title}</p></div>`;
            if (tract.hasLink && tract.url) {
                container.style.cursor = 'pointer';
                container.onclick = () => window.open(tract.url, '_blank');
            } else {
                container.style.cursor = 'default';
            }
        }

        function loadPdfPreview(tract) {
            const container = document.getElementById(`container-${tract.id}`);
            if (!container) return;

            const relPath = previewsById[tract.id];
            if (!relPath) {
                showPlaceholder(container, tract);
                return;
            }

            const img = document.createElement('img');
            img.alt = tract.title;
            img.onerror = () => showPlaceholder(container, tract);
            img.onload = () => {
                container.innerHTML = '';
                container.appendChild(img);
                if (tract.hasLink && tract.url) {
                    container.style.cursor = 'pointer';
                    container.onclick = () => window.open(tract.url, '_blank');
                }
            };
            img.src = PREVIEW_BASE + relPath.split('/').map(encodeURIComponent).join('/');
        }
