        .year-separator::after {
            content: '';
            flex: 1;
            height: 1px;

            gap: 25px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }

        .card-preview {
            width: 100%;
            height: 350px;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .card-preview canvas,
        .card-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-preview-placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9em;
            width: 100%;
            padding: 20px;
        }

        .card-preview-placeholder.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-content {
            padding: 18px 20px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .card-title {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .card-meta {
            font-size: 0.72em;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

            font-size: 0.82em;
            line-height: 1.55;
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-disabled {
            background: var(--surface-2);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-disabled:hover {
            transform: none;
        }

        .btn-label {
            display: inline-block;
            font-size: 0.75em;
            background: var(--surface-2);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;

                font-size: 1.8em;

        // Render content
        function renderContent() {
            const content = document.getElementById('content');
            const years = Object.keys(tractsData).sort((a, b) => b.localeCompare(a));

            content.innerHTML = years.map(year => `
                <section class="year-section">
                    <div class="year-separator">
                        <span class="year-separator-label">${year}</span>
                    </div>
                    <div class="grid">
                        ${[...tractsData[year]].reverse().map(tract => createCard(tract)).join('')}
                    </div>
                </section>
            `).join('');

            years.forEach(year => tractsData[year].forEach(tract => loadPdfPreview(tract)));
        }

        function createCard(tract) {
            const info = tractsInfo[tract.id];
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            return `
                <div class="card" title="${esc(tract.title)}">
                    <div class="card-preview" id="container-${tract.id}">
                        <div class="card-preview-placeholder loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${esc(info && info.subject ? info.subject : tract.title)}</h3>
                        ${info && info.date ? `<p class="card-meta">${esc(info.date)}</p>` : ''}
                        ${info && info.summary ? `<p class="card-summary">${esc(info.summary)}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function showPlaceholder(container, tract) {
            container.innerHTML = `<div class="card-preview-placeholder"><p>📄 ${tract.title}</p></div>`;
            if (tract.pdfPath) {
                container.style.cursor = 'pointer';
                container.onclick = () => {
                    const url = new URL(tract.pdfPath, window.location.href).href;
                    window.open(url, '_blank');
                };
            } else {
                container.style.cursor = 'default';
            }
        }

        function loadPdfPreview(tract) {
            const container = document.getElementById(`container-${tract.id}`);
            if (!container) return;

            if (!tract.previewPath) {
                showPlaceholder(container, tract);
                return;
            }

            const img = document.createElement('img');
            img.alt = tract.title;
            img.onerror = () => showPlaceholder(container, tract);
            img.onload = () => {
                container.innerHTML = '';
                container.appendChild(img);
                if (tract.pdfPath) {
                    container.style.cursor = 'pointer';
                    container.onclick = () => {
                        const url = new URL(tract.pdfPath, window.location.href).href;
                        window.open(url, '_blank');
                    };
                }
            };
            img.src = tract.previewPath;
        }

        // Initialize
        renderContent();
    </script>
